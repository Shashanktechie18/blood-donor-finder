{% extends "base.html" %}
{% block title %}New Emergency Request — BloodLink{% endblock %}

{% block content %}
<div class="main-content">
    <div class="page-header">
        <h1>New Emergency Request</h1>
        <p>Raise an urgent blood request — matching donors will be automatically notified</p>
    </div>
    
    <div class="card" style="max-width: 600px;">
        <form method="POST">
            <div class="form-group">
                <label class="form-label">Blood Group Required</label>
                <select name="blood_group_id" class="form-control" required>
                    <option value="">Select blood group</option>
                    {% for bg in blood_groups %}
                    <option value="{{ bg.blood_group_id }}">{{ bg.blood_group_name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label class="form-label">Units Required</label>
                <input type="number" name="units_required" class="form-control" min="1" max="20" placeholder="Number of units needed" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Priority Level</label>
                <select name="priority_level" class="form-control" required>
                    <option value="">Select priority</option>
                    <option value="Critical">🔴 Critical — Life-threatening, immediate need</option>
                    <option value="High">🟠 High — Urgent, within hours</option>
                    <option value="Medium">🟡 Medium — Needed within 24 hours</option>
                    <option value="Low">🟢 Low — Scheduled, planned procedure</option>
                </select>
            </div>
            
            <div class="d-flex gap-1" style="margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary">🚨 Submit Emergency Request</button>
                <a href="{{ url_for('hospital_dashboard') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
