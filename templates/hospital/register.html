{% extends "base.html" %}
{% block title %}Hospital Registration — BloodLink{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="login-container">
        <div class="login-hero">
            <div class="login-logo">🏥</div>
            <h1>Hospital Registration</h1>
            <p>Register your hospital to access the emergency blood request system</p>
        </div>
        
        <div class="login-card">
            <form action="{{ url_for('hospital_register') }}" method="POST">
                <div class="form-group">
                    <label class="form-label">Hospital Name</label>
                    <input type="text" name="hospital_name" class="form-control" placeholder="Enter hospital name" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Address</label>
                    <textarea name="address" class="form-control" rows="2" placeholder="Hospital address"></textarea>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Contact Number</label>
                    <input type="text" name="contact_number" class="form-control" placeholder="Enter contact number" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Create a password" required minlength="6">
                </div>
                
                <button type="submit" class="btn btn-primary w-full" style="margin-top: 0.5rem;">
                    Register Hospital
                </button>
            </form>
            
            <div class="login-footer">
                <p>Already registered? <a href="{{ url_for('index') }}">Login here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
