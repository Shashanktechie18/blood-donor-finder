{% extends "base.html" %}
{% block title %}Change Password — BloodLink{% endblock %}

{% block content %}
<div class="main-content">
    <div class="page-header" style="max-width: 500px; margin: 0 auto 2rem auto;">
        <h1>Change Password</h1>
        <p>Update your account password to keep it secure</p>
    </div>
    
    <div class="card" style="max-width: 500px; margin: 0 auto;">
        <form action="{{ url_for('change_password') }}" method="POST">
            <div class="form-group">
                <label class="form-label">Current Password</label>
                <input type="password" name="current_password" class="form-control" placeholder="Enter current password" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">New Password</label>
                <input type="password" name="new_password" class="form-control" placeholder="Enter new password (min. 6 characters)" required minlength="6">
            </div>
            
            <div class="form-group">
                <label class="form-label">Confirm New Password</label>
                <input type="password" name="confirm_password" class="form-control" placeholder="Confirm new password" required minlength="6">
            </div>
            
            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">
                    Update Password
                </button>
                <a href="/" class="btn btn-secondary" style="flex: 1; text-align: center;">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
