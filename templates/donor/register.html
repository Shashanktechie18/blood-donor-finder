{% extends "base.html" %}
{% block title %}Donor Registration — BloodLink{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="login-container">
        <div class="login-hero">
            <div class="login-logo">🩸</div>
            <h1>Donor Registration</h1>
            <p>Join the life-saving network of blood donors</p>
        </div>
        
        <div class="login-card">
            <form action="{{ url_for('donor_register') }}" method="POST">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="donor_name" class="form-control" placeholder="Enter your full name" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Age</label>
                        <input type="number" name="age" class="form-control" placeholder="Age" min="18" max="65" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Gender</label>
                        <select name="gender" class="form-control" required>
                            <option value="">Select</option>
                            <option value="M">Male</option>
                            <option value="F">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <input type="text" name="phone" class="form-control" placeholder="Enter your phone number" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Address</label>
                    <textarea name="address" class="form-control" rows="2" placeholder="Enter your address"></textarea>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Blood Group</label>
                    <select name="blood_group_id" class="form-control" required>
                        <option value="">Select your blood group</option>
                        {% for bg in blood_groups %}
                        <option value="{{ bg.blood_group_id }}">{{ bg.blood_group_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Create a password" required minlength="6">
                </div>
                
                <button type="submit" class="btn btn-primary w-full" style="margin-top: 0.5rem;">
                    Register as Donor
                </button>
            </form>
            
            <div class="login-footer">
                <p>Already registered? <a href="{{ url_for('index') }}">Login here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
